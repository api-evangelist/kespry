name: Kespry
description: >-
  Kespry was an industrial drone and aerial-intelligence company founded in the
  San Francisco Bay Area that paired automated fixed-perimeter drones with a
  cloud analytics platform to turn aerial imagery into measurable data. Its
  product was used for stockpile and inventory volumetrics in mining and
  aggregates, construction-site progress monitoring and earthworks, and insurance
  roof inspection. Backed by Lightspeed Venture Partners, Kespry was acquired by
  Firmatek in 2020 and the brand has since been retired; the former developer and
  marketing domain kespry.com now issues a 301 redirect to firmatek.com. This
  profile is retained in the API Evangelist network for lineage and portfolio
  mapping, but Kespry publishes no live, standalone developer surface, API,
  documentation, or client SDKs of its own.
